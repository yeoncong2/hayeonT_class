<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>속뜻 극장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: 어두운 상영관 → 에피소드 탭 → 16:9 스크린(1920×1080 가상 무대를 축소) → 재생 컨트롤 → 챕터 목록 */
:root{
  --room:#0E0F17; --panel:#181A26; --line:#2C2F44; --ink:#F1F2FA; --muted:#9EA3BF;
  --irony:#FF4D8D; --paradox:#FFD23F; --satire:#FF7A2F;
  --f-impact:'Black Han Sans','Noto Sans KR','Malgun Gothic',sans-serif;
  --f-disp:'Jua','Noto Sans KR','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Noto Sans KR','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
body{background:var(--room);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto;display:grid;gap:14px}
.wrap[data-clip="irony"]{--acc:var(--irony)} .wrap[data-clip="paradox"]{--acc:var(--paradox)} .wrap[data-clip="satire"]{--acc:var(--satire)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.head h1{margin:0;font:400 clamp(28px,5vw,40px)/1.1 var(--f-impact);letter-spacing:.01em}
.head h1 span{color:var(--acc);font-family:var(--f-disp);font-size:.6em;margin-left:.3em}
.head p{margin:0;color:var(--muted);font-size:14px}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tabs button{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;min-width:0}
.tabs em{font:400 12px/1 var(--f-disp);font-style:normal;color:var(--muted);letter-spacing:.08em}
.tabs b{font:400 clamp(20px,3.6vw,28px)/1.1 var(--f-impact);font-weight:400}
.tabs span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[data-clip="irony"] b{color:var(--irony)} .tabs button[data-clip="paradox"] b{color:var(--paradox)} .tabs button[data-clip="satire"] b{color:var(--satire)}
.tabs button[aria-selected="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--panel))}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.frame{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:16px;background:#000;box-shadow:0 20px 60px -20px color-mix(in srgb,var(--acc) 45%,transparent)}
.frame:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--sbg,#111)}
.cam{position:absolute;inset:0}
.poster{position:absolute;inset:0;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.4vw,14px);
  color:#fff;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--acc) 40%,#000) 0,#07070c 70%)}
.poster .ep{font:400 clamp(12px,2vw,20px)/1 var(--f-disp);letter-spacing:.3em;color:var(--acc)}
.poster .pt{font:400 clamp(54px,14vw,150px)/1 var(--f-impact)}
.poster .ps{font:400 clamp(14px,2.6vw,26px)/1.3 var(--f-disp);opacity:.85;padding:0 16px;text-align:center}
.poster .pb{margin-top:clamp(6px,1.5vw,18px);font:400 clamp(15px,2.4vw,24px)/1 var(--f-disp);background:var(--acc);color:#111;padding:.75em 1.6em;border-radius:99px}
.poster[hidden]{display:none}

.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.ctrl button{font:400 15px/1 var(--f-disp);padding:.7em 1.05em;border-radius:99px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.ctrl button.main{background:var(--acc);border-color:var(--acc);color:#111;min-width:6.2em}
.ctrl button[aria-pressed="false"]{color:var(--muted)}
.seekbox{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-width:0}
#seek{flex:1;min-width:0;accent-color:var(--acc);height:28px}
.pace{display:flex;align-items:center;gap:6px;font:400 14px/1 var(--f-disp);color:var(--muted)}
.pace select{font:inherit;color:var(--ink);background:var(--room);border:2px solid var(--line);border-radius:99px;padding:.5em .8em}
.time{font:400 14px/1 var(--f-disp);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.chap{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.chap button{width:100%;text-align:left;display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chap button span{font:400 12px/1 var(--f-disp);color:var(--muted);font-variant-numeric:tabular-nums}
.chap button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.tip{margin:0;color:var(--muted);font-size:13px}
@media (max-width:560px){.tabs span{display:none}.ctrl button{padding:.65em .85em}}

/* ===== 무대 안 (1920×1080 px 기준) ===== */
.sc{position:absolute;inset:0;overflow:hidden;visibility:hidden;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;
  text-align:center;color:#fff;font-family:var(--f-disp);padding:80px 120px 180px}
.ch{display:inline-block;white-space:pre}
.mega{font:400 300px/1 var(--f-impact)} .big{font:400 190px/1.05 var(--f-impact)} .h1{font:400 130px/1.1 var(--f-impact)}
.h2{font:400 92px/1.2 var(--f-disp)} .h3{font:400 64px/1.25 var(--f-disp)} .p{font:400 50px/1.45 var(--f-body)}
.c1{color:var(--c1)} .c2{color:var(--c2)} .dim{opacity:.7}
.eyebrow{font:400 44px/1 var(--f-disp);letter-spacing:.12em;padding:16px 36px;border-radius:99px;background:var(--c1);color:#111}
.row{display:flex;gap:70px;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;gap:26px;align-items:center}
.abs{position:absolute}
.subt{position:absolute;bottom:52px;left:0;right:0;margin-inline:auto;width:fit-content;max-width:1640px;background:rgba(0,0,0,.62);
  padding:16px 38px;border-radius:16px;font:400 44px/1.35 var(--f-body);color:#fff}
.bubble{background:#fff;color:#16121f;border-radius:46px;padding:28px 50px;font:400 66px/1.25 var(--f-disp);position:relative;box-shadow:0 12px 0 rgba(0,0,0,.25)}
.bubble::after{content:"";position:absolute;bottom:-34px;left:var(--tx,50%);border:22px solid transparent;border-top:24px solid #fff;transform:translateX(-50%)}
.think{background:rgba(255,255,255,.12);border:5px dashed var(--c1);color:var(--c1);border-radius:46px;padding:22px 44px;font:400 58px/1.25 var(--f-disp)}
.card{border-radius:40px;padding:50px 70px;background:rgba(255,255,255,.07);border:6px solid rgba(255,255,255,.18)}
.card.hot{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 16%,transparent)}
.label{font:400 40px/1 var(--f-disp);letter-spacing:.1em;opacity:.75;margin-bottom:18px}
.stampbox{font:400 120px/1 var(--f-impact);border:12px solid var(--c1);color:var(--c1);padding:20px 50px;border-radius:24px;transform:rotate(-7deg)}
.strike{position:relative;display:inline-block}
.strike .line{position:absolute;left:-3%;right:-3%;top:50%;height:16px;margin-top:-8px;background:var(--c1);border-radius:8px;transform-origin:left center}
.lines{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 2.5deg,transparent 2.5deg 10deg);animation:spin 40s linear infinite;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 3px,transparent 3.5px);background-size:48px 48px;pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{font:400 54px/1 var(--f-disp);padding:22px 40px;border-radius:99px;border:5px solid var(--c1);color:var(--c1)}
.ox{width:300px;height:300px;border-radius:50%;display:grid;place-items:center;font:400 220px/1 var(--f-impact);border:12px solid rgba(255,255,255,.35);color:rgba(255,255,255,.5)}
.avatar{width:300px;height:auto;overflow:visible}
.conf{position:absolute;left:50%;top:45%;width:26px;height:40px;border-radius:5px}
.drop{position:absolute;width:6px;height:70px;background:rgba(180,210,255,.55);border-radius:3px}
.caret{display:inline-block;width:6px;height:.9em;background:currentColor;margin-left:8px;vertical-align:-.1em;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.lines,.caret{animation:none}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<main class="wrap" id="app" data-clip="irony">
  <header class="head">
    <h1>속뜻 극장</h1>
    <p>중2 국어 · 반어·역설·풍자 동기 유발 영상 · 편당 약 1분 30초</p>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="에피소드 고르기">
    <button role="tab" id="t-irony" data-clip="irony" aria-selected="true"><em>EP.1</em><b>반어</b><span>“아~주 잘~한다!” 칭찬일까?</span></button>
    <button role="tab" id="t-paradox" data-clip="paradox" aria-selected="false"><em>EP.2</em><b>역설</b><span>말이 안 되는데 맞는 말</span></button>
    <button role="tab" id="t-satire" data-clip="satire" aria-selected="false"><em>EP.3</em><b>풍자</b><span>웃음으로 콕! 찌르기</span></button>
  </nav>
  <div class="frame" id="frame">
    <div class="stage" id="stage"><div class="cam" id="cam"></div></div>
    <button class="poster" id="poster" type="button" aria-label="영상 재생">
      <span class="ep" id="pEp">EP.1</span><span class="pt" id="pTitle">반어</span><span class="ps" id="pSub"></span><span class="pb">재생하기</span>
    </button>
  </div>
  <div class="ctrl">
    <button class="main" id="bPlay" type="button">재생</button>
    <button id="bRe" type="button">처음부터</button>
    <div class="seekbox"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치"><span class="time" id="time">0:00 / 0:00</span></div>
    <label class="pace" for="pace">글자 속도<select id="pace"><option value="1.35">느리게</option><option value="1" selected>보통</option><option value="0.75">빠르게</option></select></label>
    <button id="bSnd" type="button" aria-pressed="true">🔊 소리 켬</button>
    <button id="bFull" type="button">전체 화면</button>
  </div>
  <ol class="chap" id="chap" aria-label="장면 바로 가기"></ol>
  <p class="tip">글자가 너무 빠르거나 느리면 ‘글자 속도’를 바꿔 보세요. 스페이스바: 재생/일시정지 · ←/→: 이전/다음 장면 · 장면 이름을 누르면 그 장면으로 이동해요. 소리(배경 음악·효과음)는 재생 버튼을 누르면 함께 나와요. 소리가 안 들리면 기기 음량과 ‘소리 켬’ 버튼을 확인해 주세요.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const W = 1920, H = 1080, R = gsap.utils.random;
const frame = $('#frame'), stage = $('#stage'), cam = $('#cam');
let snd = true, AC = null, playing = false;

/* ---------- 소리 (WebAudio, 재생 중일 때만) ---------- */
let OUT = null;
function audio(){
  // 아이폰 무음 모드에서도 들리도록 (Safari 16.4+)
  try{ if (navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
  if (!AC){ AC = new (window.AudioContext || window.webkitAudioContext)(); OUT = AC.createGain(); OUT.gain.value = 1; OUT.connect(AC.destination); }
  if (AC.state !== 'running') AC.resume();
  return AC;
}
/* 영상 내내 깔리는 잔잔한 배경 음악 */
const BGM_MEL = [523,0,659,0,784,659,587,0,494,0,587,0,698,587,523,0];
const BGM_BAS = [131,131,110,110,147,147,98,98];
const BGM_STEP = .26;
let bgmTimer = null, bgmNext = 0, bgmI = 0;
function tone(f,t,type,v,d){
  if(!f) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(OUT); o.start(t); o.stop(t+d+.02);
}
function bgmStart(){
  if (bgmTimer || !snd) return;
  try{ audio(); }catch(e){ return; }
  bgmNext = AC.currentTime + .05;
  bgmTimer = setInterval(()=>{
    if (AC.state !== 'running') return;
    if (bgmNext < AC.currentTime) bgmNext = AC.currentTime + .05;
    while (bgmNext < AC.currentTime + .3){
      tone(BGM_MEL[bgmI % BGM_MEL.length], bgmNext, 'triangle', .05, BGM_STEP*1.6);
      if (bgmI % 2 === 0) tone(BGM_BAS[(bgmI/2) % BGM_BAS.length], bgmNext, 'sine', .12, BGM_STEP*1.9);
      bgmNext += BGM_STEP; bgmI++;
    }
  }, 80);
}
function bgmStop(){ clearInterval(bgmTimer); bgmTimer = null; }

const SFX = {pop:[520,1040,.09,'sine'],tick:[1300,1300,.05,'square'],boom:[160,38,.45,'sawtooth'],ding:[880,1760,.4,'triangle'],
  buzz:[200,120,.35,'square'],whoosh:[250,1400,.22,'sine'],type:[1700,1700,.02,'square'],drop:[700,200,.25,'triangle'],laugh:[420,620,.12,'triangle']};
function sfx(k){
  if (!snd || !playing) return;
  try{
    audio();
    const P = SFX[k], t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = P[3]; o.frequency.setValueAtTime(P[0], t); o.frequency.exponentialRampToValueAtTime(P[1], t + P[2]);
    g.gain.setValueAtTime(k === 'type' ? .08 : .25, t); g.gain.exponentialRampToValueAtTime(.0008, t + P[2] + .05);
    o.connect(g); g.connect(OUT); o.start(t); o.stop(t + P[2] + .08);
  }catch(e){}
}

/* ---------- 글자 쪼개기와 효과 ---------- */
function split(el){
  if (el._ch) return el._ch;
  const parts = [];
  const walk = node => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        [...n.textContent].forEach(c => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; frag.appendChild(s); parts.push(s); });
        n.replaceWith(frag);
      } else if (n.nodeType === 1 && !n.classList.contains('line')) walk(n);
    });
  };
  walk(el); el._ch = parts; return parts;
}
const FX = {
  pop:(t,el,p,st0=.05)=>{ const c=split(el), st=POP_ST*PACE; t.call(sfx,['pop'],p); const r=t.from(c,{autoAlpha:0,y:110,scale:.2,rotation:()=>R(-30,30),stagger:st,duration:.55,ease:'back.out(2.4)'},p); SHIFT+=c.length*(st-st0); return r; },
  type:(t,el,p,st0=.075)=>{ const c=split(el), st=TYPE_ST*PACE; c.forEach((_,i)=>{ if(i%2===0) t.call(sfx,['type'],p+i*st); }); const r=t.from(c,{autoAlpha:0,duration:.01,stagger:st},p); SHIFT+=c.length*(st-st0)+.4*PACE; return r; },
  rise:(t,el,p)=>t.from(el,{autoAlpha:0,y:70,duration:.6,ease:'power3.out'},p),
  fade:(t,el,p,d=.5)=>t.from(el,{autoAlpha:0,duration:d},p),
  zoom:(t,el,p)=>{ t.call(sfx,['whoosh'],p); return t.from(el,{autoAlpha:0,scale:.1,duration:.6,ease:'back.out(1.8)'},p); },
  stamp:(t,el,p)=>{ t.call(sfx,['boom'],p); t.from(el,{autoAlpha:0,scale:3.4,rotation:-14,duration:.32,ease:'power4.in'},p); return shake(t,'>'); },
  drop:(t,el,p)=>{ t.call(sfx,['drop'],p); return t.from(split(el),{y:-900,autoAlpha:0,rotation:()=>R(-50,50),stagger:.09,duration:.9,ease:'bounce.out'},p); },
  wave:(t,el,p)=>t.to(split(el),{y:-36,stagger:{each:.06,repeat:3,yoyo:true},duration:.22,ease:'sine.inOut'},p),
  glitch:(t,el,p)=>{ t.call(sfx,['buzz'],p); return t.fromTo(el,{autoAlpha:1},{keyframes:{x:[-30,24,-14,18,-6,0],skewX:[28,-20,14,-8,4,0],filter:['hue-rotate(90deg) blur(2px)','hue-rotate(-60deg)','hue-rotate(40deg) blur(1px)','none','none','none']},duration:.55},p); },
  strike:(t,el,p)=>{ t.call(sfx,['whoosh'],p); return t.from(el.querySelector('.line'),{scaleX:0,duration:.35,ease:'power2.out'},p); },
  fall:(t,el,p)=>{ t.call(sfx,['drop'],p); return t.to(split(el),{y:1000,rotation:()=>R(-120,120),stagger:.07,duration:1.1,ease:'power2.in'},p); },
  slideL:(t,el,p)=>{ t.call(sfx,['whoosh'],p); return t.from(el,{x:-1400,autoAlpha:0,duration:.6,ease:'power3.out'},p); },
  slideR:(t,el,p)=>{ t.call(sfx,['whoosh'],p); return t.from(el,{x:1400,autoAlpha:0,duration:.6,ease:'power3.out'},p); },
  flip:(t,a,b,p)=>{ t.call(sfx,['whoosh'],p); t.to(a,{rotationX:90,autoAlpha:0,duration:.3,ease:'power2.in'},p); return t.from(b,{rotationX:-90,autoAlpha:0,duration:.35,ease:'power2.out'},'>'); },
  count:(t,el,p,from=0,d=1.4)=>t.from(el,{textContent:from,snap:{textContent:1},duration:d,ease:'power1.out'},p),
};
function shake(t,p){ return t.to(cam,{keyframes:{x:[0,-26,22,-16,12,-6,0],y:[0,14,-12,8,-6,2,0]},duration:.42,ease:'none'},p); }
function flash(t,el,p){ const f=el.querySelector('.flash'); if(f) t.fromTo(f,{opacity:.9},{opacity:0,duration:.5,immediateRender:false},p); }
function confetti(t,el,p,n=50,cols=['#FF4D8D','#FFD23F','#3CE0C8','#7FA8FF','#fff']){
  const box=document.createElement('div'); box.className='abs'; box.style.inset='0'; box.style.pointerEvents='none'; el.appendChild(box);
  const bits=[]; for(let i=0;i<n;i++){ const d=document.createElement('i'); d.className='conf'; d.style.background=cols[i%cols.length]; box.appendChild(d); bits.push(d); }
  gsap.set(bits,{autoAlpha:0});
  t.call(sfx,['ding'],p);
  t.set(bits,{autoAlpha:1},p);
  t.fromTo(bits,{x:0,y:0,rotation:0},{x:()=>R(-950,950),y:()=>R(-600,200),rotation:()=>R(-720,720),duration:.9,ease:'power3.out',immediateRender:false},p);
  t.to(bits,{y:'+=700',autoAlpha:0,duration:1.4,ease:'power1.in'},'>-.1');
}
function rain(t,el,p,n=60,d=6){
  const box=document.createElement('div'); box.className='abs'; box.style.inset='0'; box.style.pointerEvents='none'; el.prepend(box);
  for(let i=0;i<n;i++){ const r=document.createElement('i'); r.className='drop'; r.style.left=R(0,1980)+'px'; r.style.transform='rotate(14deg)'; box.appendChild(r);
    const du=R(.6,1); t.fromTo(r,{y:-120-R(0,1100)},{y:1200,x:-260,duration:du,ease:'none',repeat:Math.max(0,Math.floor(d/du)-1),immediateRender:true},p); }
  return box;
}

/* ---------- 캐릭터 ---------- */
function face(m){
  const k='#2a2233', s=`stroke="${k}" stroke-width="4" stroke-linecap="round" fill="none"`;
  let e=`<circle cx="45" cy="60" r="4.5" fill="${k}"/><circle cx="75" cy="60" r="4.5" fill="${k}"/>`, x='', m2='';
  if(m==='happy'){ e=`<path d="M38 61 q7 -9 14 0 M68 61 q7 -9 14 0" ${s}/>`; m2=`<path d="M40 73 Q60 95 80 73Z" fill="#7a2c34"/>`; x=`<circle cx="32" cy="74" r="7" fill="#ff9aa8" opacity=".6"/><circle cx="88" cy="74" r="7" fill="#ff9aa8" opacity=".6"/>`; }

let TL = null, CHAP = [];
/* 글자 속도: 한 글자당 시간(초). 글자가 늦게 끝나면 그 뒤 장면 요소가 SHIFT만큼 자동으로 밀림 */
const TYPE_ST = .1, POP_ST = .075; let PACE = 1, SHIFT = 0;
const ENTERS = ['iris','wipe','zoom','iris','wipe'];
function makeScene(tl){
  let n = 0;
  return (o, fn) => {
    const el = document.createElement('div'); el.className = 'sc';
    el.style.background = o.bg || 'var(--sbg)';
    el.innerHTML = (o.deco==='lines'?'<div class="lines"></div>':o.deco==='dots'?'<div class="dots"></div>':'') + o.html + (o.sub?`<div class="subt">${o.sub}</div>`:'') + '<div class="flash"></div>';
    cam.appendChild(el);
    const t = gsap.timeline(), q = s => el.querySelector(s), qa = s => [...el.querySelectorAll(s)];
    SHIFT = 0;
    [['to',2],['from',2],['fromTo',3],['set',2],['call',2]].forEach(([m,n])=>{ const f=t[m].bind(t); t[m]=(...a)=>{ if(a.length>n && typeof a[a.length-1]==='number') a[a.length-1]+=SHIFT; return f(...a); }; });
    const enter = o.enter || ENTERS[n % ENTERS.length];
    t.set(el,{autoAlpha:1},0);
    if (enter==='iris') t.fromTo(el,{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(80% at 50% 50%)',duration:.6,ease:'power2.inOut'},0);
    else if (enter==='wipe') t.fromTo(el,{clipPath:'inset(0% 0% 0% 100%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:.6,ease:'power3.inOut'},0);
    else if (enter==='zoom') t.fromTo(el,{scale:1.4,autoAlpha:0},{scale:1,autoAlpha:1,duration:.6,ease:'power2.out'},0);
    else t.fromTo(el,{autoAlpha:0},{autoAlpha:1,duration:.3},0);
    if (o.sub) t.from(q('.subt'),{autoAlpha:0,y:40,duration:.45,ease:'power2.out'},.5);
    fn(t, q, qa, el);
    t.to({}, {duration:(o.hold ?? 1.6) * Math.max(1,PACE)});
    t.set(el,{autoAlpha:0},'+=0.6');
    const at = n === 0 ? 0 : Math.max(0, tl.duration() - .6);
    CHAP.push({name:o.name, at});
    tl.add(t, at); n++;
  };
}

<script>
/* ---------- 플레이어 ---------- */
const app=$('#app'), poster=$('#poster'), seek=$('#seek'), timeEl=$('#time'), bPlay=$('#bPlay'), bSnd=$('#bSnd'), chapEl=$('#chap');
let dragging=false;
const fmt=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function fit(){ const w=frame.clientWidth, h=frame.clientHeight, s=Math.min(w/W,h/H); stage.style.transform=`translate(${(w-W*s)/2}px,${(h-H*s)/2}px) scale(${s})`; }
try{ new ResizeObserver(fit).observe(frame); }catch(e){ addEventListener('resize',fit); }
document.addEventListener('fullscreenchange',fit);

function curChap(){ const now=TL.time(); let k=0; CHAP.forEach((c,i)=>{ if(now>=c.at-.01) k=i; }); return k; }
function upd(){
  if(!TL) return;
  if(!dragging) seek.value=Math.round(TL.progress()*1000);
  timeEl.textContent=fmt(TL.time())+' / '+fmt(TL.duration());
  const k=curChap(); chapEl.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===k));
}
function ui(){
  bPlay.textContent = playing ? '일시정지' : (TL.progress()>=.999 ? '다시 보기' : '재생');
  bSnd.textContent = snd ? '🔊 소리 켬' : '🔇 소리 끔';
  (playing && snd) ? bgmStart() : bgmStop(); bSnd.setAttribute('aria-pressed',String(snd));
}
function play(){
  if(TL.progress()>=.999) TL.progress(0);
  poster.hidden=true; playing=true;
  try{ audio(); }catch(e){}
  TL.play(); ui();
}
function pause(){ playing=false; TL.pause(); ui(); }
function toggle(){ playing ? pause() : play(); }
function jump(i){ i=Math.max(0,Math.min(CHAP.length-1,i)); poster.hidden=true; TL.seek(CHAP[i].at+.02, true); upd(); ui(); }

function load(key){
  if(TL) TL.kill();
  playing=false; cam.innerHTML=''; gsap.set(cam,{x:0,y:0}); CHAP=[];
  const c=CLIPS[key]; app.dataset.clip=key;
  stage.style.setProperty('--sbg',c.sbg); stage.style.setProperty('--c1',c.c1); stage.style.setProperty('--c2',c.c2);
  TL=gsap.timeline({paused:true,onUpdate:upd,onComplete:()=>{ playing=false; ui(); upd(); }});
  c.build(makeScene(TL), c);
  TL.seek(.05,true); TL.seek(0,true);
  chapEl.innerHTML=CHAP.map((ch,i)=>`<li><button type="button" id="ch-${key}-${i}" data-i="${i}"><span>${fmt(ch.at)}</span>${ch.name}</button></li>`).join('');
  $('#pEp').textContent=c.ep; $('#pTitle').textContent=c.title; $('#pSub').textContent=c.sub; poster.hidden=false;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.clip===key)));
  fit(); upd(); ui();
}

$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) load(b.dataset.clip); });
poster.addEventListener('click',play);
frame.addEventListener('click',e=>{ if(e.target!==poster && !poster.contains(e.target)) toggle(); });
bPlay.addEventListener('click',toggle);
$('#bRe').addEventListener('click',()=>{ TL.progress(0,true); play(); });
bSnd.addEventListener('click',()=>{ snd=!snd; ui(); });
$('#pace').addEventListener('change',e=>{ const k=curChap(), was=!poster.hidden; PACE=+e.target.value; load(app.dataset.clip); if(was) jump(k); });
$('#bFull').addEventListener('click',()=>{ try{ document.fullscreenElement ? document.exitFullscreen() : frame.requestFullscreen().catch(()=>{}); }catch(e){} });
seek.addEventListener('input',()=>{ dragging=true; poster.hidden=true; TL.progress(seek.value/1000,true); timeEl.textContent=fmt(TL.time())+' / '+fmt(TL.duration()); });
seek.addEventListener('change',()=>{ dragging=false; upd(); ui(); });
chapEl.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) jump(+b.dataset.i); });
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  if(e.code==='Space'){ if(e.target.matches('button')) return; e.preventDefault(); toggle(); }
  else if(e.key==='ArrowRight') jump(curChap()+1);
  else if(e.key==='ArrowLeft') jump(TL.time()-CHAP[curChap()].at>1.5 ? curChap() : curChap()-1);
});
if (window.gsap) load('irony'); else $('#pSub').textContent='애니메이션 도구를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.';
</script>
